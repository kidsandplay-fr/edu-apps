<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Language Learner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
        }
        h1, h2, h3, .level-btn {
            font-family: 'Fredoka', sans-serif;
        }
        
        .card-container {
            perspective: 1000px;
        }

        .word-row {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .word-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .level-btn:hover {
            animation: bounce-subtle 1s infinite;
        }

        @keyframes float-up {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -100%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
        }
        .floating-score {
            animation: float-up 1.2s ease-out forwards;
        }

        @keyframes pulse-flame {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(249, 115, 22, 0.5)); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
        }
        .combo-active {
            animation: pulse-flame 0.5s infinite;
        }

        .shape {
            position: absolute;
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>

        const timerBarContainer = document.getElementById('timer-bar-container');
        const timerBar = document.getElementById('timer-bar');

        let audioInitialized = false;
        let successSynth, errorSynth, decaySynth;

        async function initAudio() {
            if (audioInitialized) return;
            if (typeof Tone === 'undefined') return;

            try {
                await Tone.start();
                
                successSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 1 }
                }).toDestination();
                successSynth.volume.value = -5;

                errorSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
                }).toDestination();
                errorSynth.volume.value = -10;
                
                decaySynth = new Tone.MembraneSynth({
                    pitchDecay: 0.1,
                    octaves: 1.5,
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0, release: 0.1 }
                }).toDestination();
                decaySynth.volume.value = -12;

                audioInitialized = true;
            } catch (error) {
                console.error("Audio initialization failed:", error);
            }
        }

        function playSound(type) {
            if (!audioInitialized) return;
            if (type === 'success' && successSynth) successSynth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
            if (type === 'error' && errorSynth) errorSynth.triggerAttackRelease("C2", "8n");
            if (type === 'decay' && decaySynth) decaySynth.triggerAttackRelease("G1", "8n");
        }

        let currentLevelData = null;
        let remainingWords = [];   
        let matchedCount = 0;      
        let totalPairs = 0;
        
        let score = 0;
        let streak = 0;
        let comboMultiplier = 1;
        
        let leftSlots = Array(5).fill(null);
        let rightSlots = Array(5).fill(null);
        let pendingEmptyPairs = 0;
        let activePairsCount = 0;
        
        let selectedLeft = null;     
        let selectedRight = null;     
        let isCheckingMatch = false; 

        let timerFrame;
        let timerEndTime;
        const COMBO_TIME_LIMIT = 5000; // 5 seconds

        function startComboTimer() {
            if (matchedCount >= totalPairs) return;
            
            timerBarContainer.classList.remove('hidden');
            timerEndTime = Date.now() + COMBO_TIME_LIMIT;
            cancelAnimationFrame(timerFrame);
            
            function updateTimer() {
                const now = Date.now();
                const remaining = timerEndTime - now;
                
                if (remaining <= 0) {
                    timerBar.style.width = '0%';
                    triggerComboDecay();
                } else {
                    const percent = (remaining / COMBO_TIME_LIMIT) * 100;
                    timerBar.style.width = percent + '%';
                    
                    if (percent < 25) {
                        timerBar.className = 'h-full w-full bg-red-500 transition-colors';
                    } else if (percent < 50) {
                        timerBar.className = 'h-full w-full bg-orange-400 transition-colors';
                    } else {
                        timerBar.className = 'h-full w-full bg-emerald-400 transition-colors';
                    }
                    
                    timerFrame = requestAnimationFrame(updateTimer);
                }
            }
            updateTimer();
        }

        function stopComboTimer() {
            cancelAnimationFrame(timerFrame);
            timerBarContainer.classList.add('hidden');
        }

        function triggerComboDecay() {
            if (streak > 0) {
                streak = 0;
                comboMultiplier = 1;
                
                // Visual decay cue
                comboText.textContent = "Lost!";
                comboIcon.textContent = "💨";
                comboContainer.classList.add('text-red-500', 'animate-pulse');
                comboContainer.classList.remove('hidden');
                
                playSound('decay');
                
                setTimeout(() => {
                    comboContainer.classList.remove('text-red-500', 'animate-pulse');
                    comboIcon.textContent = "🔥";
                    updateScoreDisplay();
                }, 1000);
            }
            stopComboTimer();
        }

            if (!currentLevelData) return;

            updateLanguages();

            matchedCount = 0;
            totalPairs = currentLevelData.words.length;
            remainingWords = [...currentLevelData.words]; 
            
            score = 0;
            streak = 0;
            comboMultiplier = 1;
            updateScoreDisplay();
            stopComboTimer();
            
            leftSlots = Array(5).fill(null);
            rightSlots = Array(5).fill(null);

            selectedLeft = null;

            levelTitle.className = `text-lg sm:text-xl md:text-3xl font-bold text-center flex-grow truncate px-2 text-${currentLevelData.color}-600`;

            gameBoard.classList.remove('hidden');
            victoryMessage.classList.add('hidden');

        function updateProgress() {
            progressText.textContent = `${matchedCount} / ${totalPairs}`;
        }

        function updateScoreDisplay() {
            scoreText.textContent = score;
            if (comboMultiplier > 1) {
                comboContainer.classList.remove('hidden');
                comboText.textContent = comboMultiplier + 'x';
            } else {
                comboContainer.classList.add('hidden');
            }
        }

        function showFloatingScore(points, leftBtn, rightBtn) {
            const boardRect = gameBoard.getBoundingClientRect();
            const leftRect = leftBtn.getBoundingClientRect();
            const rightRect = rightBtn.getBoundingClientRect();
            
            const centerX = (leftRect.right + rightRect.left) / 2 - boardRect.left;
            const centerY = (leftRect.top + rightRect.top) / 2 - boardRect.top;

            const floatEl = document.createElement('div');
            floatEl.className = 'absolute text-2xl md:text-5xl font-black text-emerald-500 drop-shadow-lg pointer-events-none z-50 floating-score flex flex-col items-center justify-center text-center';
            
            let text = `+${points}`;
            if (comboMultiplier > 1) text += `<br><span class="text-xl md:text-3xl text-orange-400 mt-1 drop-shadow">Combo ${comboMultiplier}x!</span>`;
            if (points % 10 === 5) text += `<br><span class="text-base md:text-2xl text-sky-400 mt-1 drop-shadow">⚡ Speed Bonus!</span>`;
            
            floatEl.innerHTML = text;
            floatEl.style.left = centerX + 'px';
            floatEl.style.top = centerY + 'px';
            floatEl.style.transform = 'translate(-50%, -50%)';
            gameBoard.appendChild(floatEl);

            setTimeout(() => floatEl.remove(), 1200);
        }

        function initializeBoard() {
            colLeft.innerHTML = '';
            colRight.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const leftSlot = document.createElement('div');
                leftSlot.className = 'word-slot w-full h-16 sm:h-20 md:h-24 transition-all duration-300';
                leftSlot.dataset.slotIndex = i;
                colLeft.appendChild(leftSlot);

                const rightSlot = document.createElement('div');
                rightSlot.className = 'word-slot w-full h-16 sm:h-20 md:h-24 transition-all duration-300';
                rightSlot.dataset.slotIndex = i;
                colRight.appendChild(rightSlot);
            }
            fillEmptySlots(5);
        }

        function fillEmptySlots(maxToFill = 2) {
            const leftEmptyIndices = leftSlots.map((val, idx) => val === null ? idx : -1).filter(idx => idx !== -1);
            const rightEmptyIndices = rightSlots.map((val, idx) => val === null ? idx : -1).filter(idx => idx !== -1);
            
            const slotsAvailable = Math.min(leftEmptyIndices.length, rightEmptyIndices.length, maxToFill);
            const numToAdd = Math.min(slotsAvailable, remainingWords.length);
            
            if (numToAdd === 0) return;

            shuffleArray(remainingWords);
            const newWords = remainingWords.splice(0, numToAdd);
            newWords.forEach(w => w.id = Math.random().toString(36).substr(2, 9));

            let leftNewWords = [...newWords];
            let rightNewWords = [...newWords];
            
            shuffleArray(leftNewWords);
            shuffleArray(rightNewWords);
            shuffleArray(leftEmptyIndices);
            shuffleArray(rightEmptyIndices);

            for (let i = 0; i < numToAdd; i++) {
                const leftIdx = leftEmptyIndices[i];
                const rightIdx = rightEmptyIndices[i];
                
                leftSlots[leftIdx] = leftNewWords[i];
                rightSlots[rightIdx] = rightNewWords[i];
                
                renderButton('left', leftIdx, leftNewWords[i]);
                renderButton('right', rightIdx, rightNewWords[i]);
            }
            
            activePairsCount += numToAdd;
            pendingEmptyPairs = Math.max(0, pendingEmptyPairs - numToAdd);
        }

        function renderButton(side, slotIndex, word) {
            const color = currentLevelData.color;
            const btn = document.createElement('button');
            
            let baseClasses = `vocab-btn w-full h-full p-2 md:p-4 rounded-xl md:rounded-2xl border-2 md:border-4 border-${color}-100 bg-white hover:bg-${color}-50 hover:border-${color}-300 transition-all duration-300 shadow-sm text-sm md:text-xl font-bold text-slate-700 flex items-center leading-tight opacity-0 scale-90`;

            btn.dataset.id = word.id;
            btn.dataset.side = side;
            btn.dataset.dropTime = Date.now();
            
            if (side === 'left') {
                btn.className = `${baseClasses} text-left gap-2 md:gap-4`;
                btn.innerHTML = `<span class="text-xl md:text-4xl bg-${color}-100 p-1.5 md:p-2 rounded-lg md:rounded-xl shadow-inner flex-shrink-0">${word.emoji}</span> <span class="break-words leading-tight w-full">${word[langLeft]}</span>`;
            } else {
                btn.className = `${baseClasses} text-left gap-2 md:gap-4`;
                btn.innerHTML = `<span class="text-xl md:text-4xl bg-slate-100 p-1.5 md:p-2 rounded-lg md:rounded-xl shadow-inner flex-shrink-0 grayscale opacity-70">💬</span> <span class="break-words leading-tight w-full">${word[langRight]}</span>`;
            }

            btn.onclick = () => handleSelection(btn, side);
            
            const col = side === 'left' ? colLeft : colRight;
            const slot = col.children[slotIndex];
            slot.innerHTML = ''; 
            slot.appendChild(btn);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    btn.classList.remove('opacity-0', 'scale-90');
                    btn.classList.add('opacity-100', 'scale-100');
                });
            });
        }

        function handleSelection(btnElement, side) {
            if (isCheckingMatch) return; 
            initAudio(); 
            
            const color = currentLevelData.color;
            const selectedStyleClasses = [`bg-${color}-100`, `border-${color}-500`, 'scale-[1.02]', 'shadow-inner', 'ring-4', `ring-${color}-200`];

            if (side === 'left') {
                if (selectedLeft) selectedLeft.classList.remove(...selectedStyleClasses);
                if (selectedLeft === btnElement) selectedLeft = null;
                else {
                    selectedLeft = btnElement;
                    selectedLeft.classList.add(...selectedStyleClasses);
                }
            } else {
                if (selectedRight) selectedRight.classList.remove(...selectedStyleClasses);
                if (selectedRight === btnElement) selectedRight = null;
                else {
                    selectedRight = btnElement;
                    selectedRight.classList.add(...selectedStyleClasses);
                }
            }

            if (selectedLeft && selectedRight) checkMatch();
        }

        function checkMatch() {
            isCheckingMatch = true;
            
            const idLeft = selectedLeft.dataset.id;
            const idRight = selectedRight.dataset.id;
            const color = currentLevelData.color;

            if (idLeft === idRight) {
                const leftIndex = parseInt(selectedLeft.parentElement.dataset.slotIndex);
                const rightIndex = parseInt(selectedRight.parentElement.dataset.slotIndex);

                streak++;
                if (streak >= 5) comboMultiplier = 3;
                else if (streak >= 3) comboMultiplier = 2;
                else comboMultiplier = 1;

                const dropTimeLeft = parseInt(selectedLeft.dataset.dropTime);
                const dropTimeRight = parseInt(selectedRight.dataset.dropTime);
                const now = Date.now();
                let speedBonus = ((now - dropTimeLeft <= 3000) || (now - dropTimeRight <= 3000)) ? 5 : 0;

                const pointsEarned = (10 * comboMultiplier) + speedBonus;
                score += pointsEarned;
                
                updateScoreDisplay();
                showFloatingScore(pointsEarned, selectedLeft, selectedRight);
                playSound('success');

                // Start or reset timer for the NEXT match
                startComboTimer();

                selectedLeft.classList.replace(`border-${color}-500`, 'border-emerald-500');
                selectedLeft.classList.replace(`bg-${color}-100`, 'bg-emerald-200');
                selectedLeft.classList.replace(`ring-${color}-200`, 'ring-emerald-200');
                
                selectedRight.classList.replace(`border-${color}-500`, 'border-emerald-500');
                selectedRight.classList.replace(`bg-${color}-100`, 'bg-emerald-200');
                selectedRight.classList.replace(`ring-${color}-200`, 'ring-emerald-200');

                setTimeout(() => {
                    selectedLeft.classList.remove('opacity-100', 'scale-100', 'scale-[1.02]');
                    selectedRight.classList.remove('opacity-100', 'scale-100', 'scale-[1.02]');
                    selectedLeft.classList.add('opacity-0', 'scale-90');
                    selectedRight.classList.add('opacity-0', 'scale-90');
                    
                    setTimeout(() => {
                        selectedLeft.remove();
                        selectedRight.remove();
                        
                        leftSlots[leftIndex] = null;
                        rightSlots[rightIndex] = null;
                        activePairsCount--;
                        
                        matchedCount++;
                        updateProgress();
                        
                        pendingEmptyPairs++;

                        if (matchedCount === totalPairs) {
                            showVictory();
                        } else if (pendingEmptyPairs >= 2 || (pendingEmptyPairs > 0 && activePairsCount === 0)) {
                            fillEmptySlots(pendingEmptyPairs);
                        }
                        
                        selectedLeft = null;
                        selectedRight = null;
                        isCheckingMatch = false;
                    }, 300); 
                }, 400); 
                
            } else {
                streak = 0;
                comboMultiplier = 1;
                updateScoreDisplay();
                playSound('error');
                stopComboTimer(); 

                selectedLeft.classList.replace(`border-${color}-500`, 'border-red-400');
                selectedRight.classList.replace(`border-${color}-500`, 'border-red-400');
                selectedLeft.classList.replace(`ring-${color}-200`, 'ring-red-200');
                selectedRight.classList.replace(`ring-${color}-200`, 'ring-red-200');
                
                selectedLeft.animate([{ transform: 'translateX(-5px) scale(1.02)' }, { transform: 'translateX(5px) scale(1.02)' }, { transform: 'translateX(0) scale(1.02)' }], { duration: 300 });
                selectedRight.animate([{ transform: 'translateX(-5px) scale(1.02)' }, { transform: 'translateX(5px) scale(1.02)' }, { transform: 'translateX(0) scale(1.02)' }], { duration: 300 });

                setTimeout(() => {
                    selectedLeft.classList.remove('border-red-400', `bg-${color}-100`, 'scale-[1.02]', 'shadow-inner', 'ring-4', 'ring-red-200');
                    selectedRight.classList.remove('border-red-400', `bg-${color}-100`, 'scale-[1.02]', 'shadow-inner', 'ring-4', 'ring-red-200');
                    
                    selectedLeft = null;
                    selectedRight = null;
                    isCheckingMatch = false;
                }, 800);
            }
        }

        function showVictory() {
            stopComboTimer();
            gameBoard.classList.add('hidden');
            victoryMessage.classList.remove('hidden');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
</body>
