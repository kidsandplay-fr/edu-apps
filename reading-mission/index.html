<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Reading Adventure - 10 Levels!</title>
    <style>
        :root {
            --primary: #4CAF50;
            --bg-color: #E0F7FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --star-color: #FFC107;
            --error-color: #FF5252;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 650px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #2196F3;
        }

        #stars {
            font-size: 2.5rem;
            color: var(--star-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        #image-display {
            font-size: 7rem;
            margin: 15px 0;
            animation: bounce 2s infinite ease-in-out;
        }

        #word-display {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #555;
            font-weight: bold;
        }

        .missing-letter {
            color: #FF9800;
            border-bottom: 5px solid #FF9800;
            padding: 0 5px;
            display: inline-block;
            min-width: 40px;
        }

        #options {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button.choice-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 2.5rem;
            min-width: 80px;
            height: 80px;
            padding: 0 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0D47A1;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: inherit;
            font-weight: bold;
            text-transform: lowercase;
        }

        button.choice-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #0D47A1;
        }

        button.choice-btn.wrong {
            background-color: var(--error-color);
            box-shadow: 0 6px 0 #B71C1C;
            animation: shake 0.5s;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.98);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .overlay-btn {
            background-color: #FF9800;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #E65100;
            font-family: inherit;
            font-weight: bold;
            margin: 10px;
        }

        .overlay-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #E65100;
        }

        .lang-btn {
            background-color: #9C27B0;
            box-shadow: 0 6px 0 #6A1B9A;
            width: 80%;
            max-width: 300px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        #progress-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>

        function hideAllOverlays() {
            Object.values(screens).forEach(s => s.style.display = 'none');
        }

        function updateUIText() {
            const strings = uiStrings[currentLang];
            document.getElementById('ui-start-title').innerText = strings.startTitle;
            document.getElementById('ui-start-sub').innerText = strings.startSub;
            document.getElementById('ui-start-btn').innerText = strings.startBtn;
            
            document.getElementById('ui-fail-title').innerText = strings.failTitle;
            document.getElementById('ui-fail-btn').innerText = strings.failBtn;
            
            document.getElementById('ui-lvl-title').innerText = strings.lvlTitle;
            document.getElementById('ui-lvl-sub').innerText = strings.lvlSub;
            document.getElementById('ui-lvl-btn').innerText = strings.lvlBtn;
            
            document.getElementById('ui-win-title').innerText = strings.winTitle;
            document.getElementById('ui-win-btn').innerText = strings.winBtn;
        }

        function selectLang(lang) {
            currentLang = lang;
            updateUIText();
            hideAllOverlays();
            screens.start.style.display = 'flex';
        }

        function resetToLang() {
            hideAllOverlays();
            screens.lang.style.display = 'flex';
        }

        function startGame() {
            currentLevel = 1;
            initLevel();
        }

        function restartLevel() {
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            initLevel();
        }

        function initLevel() {
            hideAllOverlays();
            stars = 3;
            currentQIndex = 0;
            updateStars();
            
            elLevel.innerText = `${uiStrings[currentLang].levelWord} ${currentLevel}`;
            activeQuestions = [...levelWords[currentLang][currentLevel]].sort(() => Math.random() - 0.5);
            
            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuestions[currentQIndex];
            currentCorrectLetter = q.letter;
            
            // Generate exact number of underscores separated by space depending on target length
            const underscores = Array(currentCorrectLetter.length).fill('_').join(' ');
            
            elImage.innerText = q.emoji;
            elWord.innerHTML = `<span class="missing-letter">${underscores}</span> ${q.tail.split('').join(' ')}`;
            
            const strings = uiStrings[currentLang];
            elProgress.innerText = `${strings.wordWord} ${currentQIndex + 1} ${strings.ofWord} 6`;

            generateOptionsUI();
        }

        function generateOptionsUI() {
            elOptions.innerHTML = '';
            
            let allowedLetters = targetLetters[currentLang][currentLevel];
            let minOptions = 2;
            let maxOptions = Math.min(4, allowedLetters.length);
            
            let numOptions = 2;
            if (maxOptions > 2) {
                numOptions = Math.floor(Math.random() * (maxOptions - minOptions + 1)) + minOptions;
            }

            let choices = new Set([currentCorrectLetter]);

            while (choices.size < numOptions) {
                let randomLetter = allowedLetters[Math.floor(Math.random() * allowedLetters.length)];
                choices.add(randomLetter);
            }

            let finalChoices = Array.from(choices).sort(() => Math.random() - 0.5);

            finalChoices.forEach(letter => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = letter;
                btn.onclick = () => handleAnswer(letter, btn);
                elOptions.appendChild(btn);
            });
        }

        function handleAnswer(selectedLetter, buttonElement) {
            let allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedLetter === currentCorrectLetter) {
                // Formatting the correctly answered block
                elWord.innerHTML = `<span class="missing-letter" style="color: #4CAF50; border-color: #4CAF50;">${selectedLetter.split('').join(' ')}</span> ${activeQuestions[currentQIndex].tail.split('').join(' ')}`;
                buttonElement.style.backgroundColor = '#4CAF50';
                buttonElement.style.boxShadow = '0 6px 0 #2E7D32';

                setTimeout(() => {
                    currentQIndex++;
                    if (currentQIndex >= 6) {
                        checkLevelComplete();
                    } else {
                        loadQuestion();
                    }
                }, 1000);
            } else {
                buttonElement.classList.add('wrong');
                stars--;
                updateStars();

                setTimeout(() => {
                    buttonElement.classList.remove('wrong');
                    
                    if (stars <= 0) {
                        screens.restart.style.display = 'flex';
                    } else {
                        allBtns.forEach(b => b.disabled = false);
                    }
                }, 500);
            }
        }

        function updateStars() {
            let starsHtml = '';
            for (let i = 0; i < 3; i++) {
                if (i < stars) starsHtml += '⭐';
                else starsHtml += '❌';
            }
            elStars.innerText = starsHtml;
        }

        function checkLevelComplete() {
            const maxLevels = Object.keys(targetLetters[currentLang]).length;
            if (currentLevel === maxLevels) {
                screens.win.style.display = 'flex';
            } else {
                screens.levelup.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
