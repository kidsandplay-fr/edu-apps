<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Map Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; overscroll-behavior: none; }
        
        .map-container { flex: 1; min-height: 150px; width: 100%; position: relative; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        
        .country { 
            stroke: #ffffff; 
            stroke-width: 1px; 
            stroke-linejoin: round;
            transition: fill 0.2s ease, stroke-width 0.2s ease; 
            pointer-events: none; 
        }
        
        @keyframes pulse-stroke {
            0% { stroke: #ca8a04; stroke-width: 2px; filter: drop-shadow(0 0 4px rgba(234, 179, 8, 0.6)); }
            100% { stroke: #854d0e; stroke-width: 4px; filter: drop-shadow(0 0 12px rgba(234, 179, 8, 1)); }
        }
        
        .country.glowing { 
            fill: #fde047 !important; /* Bright Yellow Fill overrides any inline styling */
            animation: pulse-stroke 0.8s infinite alternate ease-in-out; 
            z-index: 10; 
        }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        
        .option-btn { transition: all 0.2s ease; }
        .option-btn:active { transform: scale(0.95); }
        .btn-correct { background-color: #22c55e !important; border-color: #166534 !important; color: white !important; transform: scale(1.05); }
        .btn-wrong { background-color: #ef4444 !important; border-color: #991b1b !important; color: white !important; animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden text-slate-800 relative">

    <!-- Loading Screen -->
    <div id="loading-screen" class="absolute inset-0 bg-blue-100 z-[60] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>

            <span class="text-xl md:text-2xl">🌍</span>

        </div>

                <option value="fr">🇫🇷 FR</option>
                <option value="el">🇬🇷 EL</option>
            </select>
        </div>
    </header>

    <!-- Main Game Area -->
    <main id="game-area" class="flex-1 flex flex-col w-full max-w-5xl mx-auto relative hidden z-10">
        
        <!-- Floating Score Banner -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
            <div class="bg-white/90 backdrop-blur border-4 border-blue-400 text-blue-800 px-5 py-1.5 rounded-full font-black text-xl shadow-md flex items-center gap-2 pointer-events-auto">
                <span data-i18n="score">Score:</span> 
                <span id="score-text" class="text-blue-600">0 / 10</span>
            </div>
        </div>

        <!-- SVG Map Container -->
        <div class="map-container" id="map-container">
            <svg id="map"></svg>
        </div>

        <!-- Options Container -->
        <div class="bg-white w-full rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] p-3 md:p-4 shrink-0 z-20 pb-6 md:pb-4">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 md:gap-3 max-w-lg sm:max-w-4xl mx-auto" id="options-grid">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </main>

    <!-- Continent Selection / Win Overlay -->
    <div id="overlay-screen" class="absolute inset-0 bg-blue-500/95 backdrop-blur-sm z-40 flex flex-col items-center justify-center hidden pt-10">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl text-center max-w-md w-11/12 border-8 border-yellow-400 max-h-[90dvh] overflow-y-auto">

            <p id="overlay-text" class="text-base md:text-lg text-slate-600 mb-4 font-bold" data-i18n="welcomeText">Where do you want to explore?</p>

            { id: "780", code: "tt", cont: "america", name: { en: "Trinidad and Tobago", fr: "Trinité-et-Tobago", el: "Τρινιντάντ και Τομπάγκο" } },

            { id: "858", code: "uy", cont: "america", name: { en: "Uruguay", fr: "Uruguay", el: "Ουρουγουάη" } },
            { id: "862", code: "ve", cont: "america", name: { en: "Venezuela", fr: "Venezuela", el: "Βενεζουέλα" } }
        ];

        // --- CAMERA BOUNDING BOXES ---
        const CONTINENT_BOUNDS = {
            europe: { minLon: -24, maxLon: 40, minLat: 34.5, maxLat: 71.5 },
            africa: { minLon: -20, maxLon: 55, minLat: -35, maxLat: 40 },
            // Asia/Oceania bounds: South stops strictly below New Zealand (-48)
            asia: { minLon: 60, maxLon: 140, minLat: -42, maxLat: 60 },
            america: { minLon: -170, maxLon: -40, minLat: -26, maxLat: 51.5 } 
        };
        
        const PASTEL_COLORS = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff', '#f3c4fb'];

        let currentLang = 'en', score = 0, targetScore = 10;
        let gameQueue = [], currentTarget = null, isWaitingForNext = false;
        let globalGeoData = null; 

        const els = {
            loading: document.getElementById('loading-screen'), gameArea: document.getElementById('game-area'),
            overlay: document.getElementById('overlay-screen'), optionsGrid: document.getElementById('options-grid'),
            scoreText: document.getElementById('score-text'), langSelect: document.getElementById('lang-select'),
            svg: d3.select("#map"), contButtons: document.getElementById('continent-buttons')
        };

        async function init() {
            els.langSelect.addEventListener('change', (e) => { 
                currentLang = e.target.value; 
                updateUI_i18n(); 
                if (currentTarget) renderOptions(); 
            });
            updateUI_i18n();
            await fetchTopoJson();
            els.loading.classList.add('hidden');
            els.overlay.classList.remove('hidden');
        }

        function updateUI_i18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N[currentLang]?.[key]) el.innerText = I18N[currentLang][key];
            });
            els.scoreText.innerText = `${score} / ${targetScore}`;
        }

        async function fetchTopoJson() {
            try {
                const response = await fetch('https://unpkg.com/world-atlas@2.0.2/countries-50m.json');
                const world = await response.json();
                globalGeoData = topojson.feature(world, world.objects.countries).features;
            } catch (error) {
                console.error("Map fetch error:", error);
                els.loading.innerHTML = `<h2 class="text-red-500">Error loading map data. Please refresh.</h2>`;
            }
        }

        function filterAndDrawMap(cont) {
            const bounds = CONTINENT_BOUNDS[cont];

            const boundingFeature = {
                type: "Feature",
                geometry: {
                    type: "Polygon",
                    coordinates: [[
                        [bounds.minLon, bounds.maxLat], [bounds.maxLon, bounds.maxLat],
                        [bounds.maxLon, bounds.minLat], [bounds.minLon, bounds.minLat],
                        [bounds.minLon, bounds.maxLat]
                    ]]
                }
            };

            const width = 800, height = 600;
            els.svg.selectAll("*").remove(); 
            els.svg.attr("viewBox", `0 0 ${width} ${height}`);
            
            const proj = d3.geoMercator()
                .fitExtent([[20, 20], [width - 20, height - 20]], boundingFeature)
                .clipExtent([[0, 0], [width, height]]);
                
            const pathGen = d3.geoPath().projection(proj);

            // Get a list of all IDs that officially belong to the currently selected continent
            const activeContinentIds = COUNTRY_DB.filter(c => c.cont === cont).map(c => c.id);

            els.svg.selectAll("path")
                .data(globalGeoData.filter(d => d.geometry))
                .enter().append("path")
                .attr("d", pathGen)
                .attr("class", "country")
                .attr("data-id", d => d.id)
                // Determine coloring: If the country belongs to the chosen continent, give it a fun pastel color.
                // Otherwise, color it a neutral gray to show it's out of bounds.
                .attr("fill", d => {
                    if (activeContinentIds.includes(d.id)) {
                        return PASTEL_COLORS[Math.floor(Math.random() * PASTEL_COLORS.length)];
                    }
                    return '#e2e8f0'; // slate-200
                });
        }

        function startGame(cont) {
            confetti.reset();
            score = 0; 
            isWaitingForNext = false;
            
            const pool = COUNTRY_DB.filter(c => c.cont === cont);
            gameQueue = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
            
            els.overlay.classList.add('hidden'); 
            els.gameArea.classList.remove('hidden');
            
            updateUI_i18n(); 
            filterAndDrawMap(cont);
            nextQuestion();
        }

        function nextQuestion() {
            isWaitingForNext = false;
            d3.selectAll('.country').classed('glowing', false);
            
            if (score >= gameQueue.length) { 
                endGame(); 
                return; 
            }
            
            currentTarget = gameQueue[score];
            
            // Bring target to front layer and apply glow
            const targetPath = d3.select(`path[data-id="${currentTarget.id}"]`);
            if (!targetPath.empty()) {
                targetPath.raise().classed('glowing', true);
            }
            
            renderOptions();
        }

        function renderOptions() {
            if (!currentTarget) return;
            const pool = COUNTRY_DB.filter(c => c.cont === currentTarget.cont && c.id !== currentTarget.id);
            const distractors = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [currentTarget, ...distractors].sort(() => 0.5 - Math.random());
            
            els.optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-white border-2 sm:border-4 border-slate-200 text-slate-700 font-bold py-2 px-1 sm:px-2 rounded-xl sm:rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 min-h-[70px] sm:min-h-[80px]";
                btn.innerHTML = `<img src="https://flagcdn.com/w40/${opt.code}.png" class="h-5 sm:h-6 object-contain rounded-sm shadow-sm pointer-events-none"><span class="text-xs sm:text-sm font-black pointer-events-none text-center leading-tight">${opt.name[currentLang]}</span>`;
                btn.onclick = () => handleGuess(btn, opt.id);
                els.optionsGrid.appendChild(btn);
            });
        }

        function handleGuess(btn, id) {
            if (isWaitingForNext) return;
            if (id === currentTarget.id) {
                isWaitingForNext = true; 
                btn.classList.add('btn-correct'); 
                score++; 
                updateUI_i18n();
                
                const rect = btn.getBoundingClientRect();
                confetti({ 
                    particleCount: 40, spread: 50, zIndex: 100, 
                    origin: { x: (rect.left + rect.width/2)/window.innerWidth, y: (rect.top + rect.height/2)/window.innerHeight } 
                });
                
                setTimeout(nextQuestion, 1200);
            } else { 
                btn.classList.add('btn-wrong'); 
                setTimeout(() => {
                    btn.classList.remove('btn-wrong');
                    btn.classList.add('opacity-40', 'pointer-events-none');
                }, 400); 
            }
        }

        function endGame() {
            let end = Date.now() + 3000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#3b82f6', '#eab308', '#ef4444', '#22c55e'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#3b82f6', '#eab308', '#ef4444', '#22c55e'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            els.gameArea.classList.add('hidden');
            
            document.getElementById('overlay-icon').innerText = "🏆";
            document.getElementById('overlay-title').setAttribute('data-i18n', 'winTitle');
            document.getElementById('overlay-text').setAttribute('data-i18n', 'winText');
            els.contButtons.style.display = "grid"; 
            
            updateUI_i18n();
            els.overlay.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
