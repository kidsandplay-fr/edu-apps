
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Orthographe CE2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Fredoka', sans-serif; }
        .bouncy { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy:hover { transform: scale(1.05) translateY(-4px); }
        .bouncy:active { transform: scale(0.95); }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake-animation { animation: shake 0.4s ease-in-out; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }

        .correct-btn { background-color: #a7f3d0 !important; color: #065f46 !important; border-color: #34d399 !important; box-shadow: 0 0 15px rgba(52, 211, 153, 0.5); }
        .wrong-btn { background-color: #fecaca !important; color: #991b1b !important; border-color: #f87171 !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-300 via-blue-400 to-purple-400 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

            </div>
            <div class="flex items-center space-x-2">
                <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Série</span>
                <div id="streak-stars" class="text-xl">🤍🤍🤍</div>
            </div>
        </div>

        <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2 text-center drop-shadow-sm">
            Mission Orthographe !

                <p class="text-base text-slate-500 mb-2 font-semibold">Complète le mot mystère :</p>

                    <!-- Word injected here -->
                </div>
                
                <!-- Multiple Choice Grid -->
                <div id="options-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="hidden text-center text-xl md:text-2xl font-bold p-4 rounded-2xl transform transition-all"></div>
        </div>
    </div>

            { word: "_il", full: "fil", options: ["f", "ph", "ff"], answer: "f", emoji: "🧵" },
            { word: "_leur", full: "fleur", options: ["f", "ph", "ff"], answer: "f", emoji: "🌸" },
            { word: "d_phin", full: "dauphin", options: ["au", "eau", "o"], answer: "au", emoji: "🐬" } // Bonus O/Au
        ];

        let questions = [...baseQuestions];
        let mistakes = JSON.parse(localStorage.getItem('ce2-mistakes') || '[]');
        let currentQuestion = null;
        let score = 0;
        let currentStreak = 0;

        function getNextQuestion() {
            // 50% chance to ask a previously failed question if there are any
            if (mistakes.length > 0 && Math.random() > 0.5) {
                return mistakes.shift();
            }
            // Otherwise pick a random question
            return questions[Math.floor(Math.random() * questions.length)];
        }

        function updateStreakDisplay() {
            const streakDisplay = document.getElementById('streak-stars');
            let stars = '';
            for(let i=0; i<3; i++) {
                stars += (i < currentStreak % 3 || currentStreak >= 3 && currentStreak % 3 === 0 && i < 3) ? '⭐' : '🤍';
            }
            if(currentStreak > 0 && currentStreak % 3 === 0) stars = '⭐⭐⭐'; // Show full when hit
            streakDisplay.innerText = stars;
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b']
            });
        }

        function renderQuestion() {
            currentQuestion = getNextQuestion();
            const display = document.getElementById('word-display');
            const grid = document.getElementById('options-grid');
            const feedback = document.getElementById('feedback');
            const emojiDisplay = document.getElementById('emoji-display');
            const questionArea = document.getElementById('question-area');

            // Reset animations
            questionArea.classList.remove('shake-animation');
            
            // Format the word: Replace '_' with a visible colored underscore
            const formattedWord = currentQuestion.word.replace('_', '<span class="text-pink-500 font-extrabold border-b-4 border-pink-500 inline-block min-w-[24px] mx-1 leading-none">_</span>');
            
            display.innerHTML = formattedWord;
            emojiDisplay.innerText = currentQuestion.emoji || "❓";
            grid.innerHTML = '';
            
            feedback.classList.add('hidden');
            feedback.className = "hidden text-center text-xl md:text-2xl font-bold p-4 rounded-2xl transform transition-all";

            // Shuffle options for randomness
            const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bouncy p-4 bg-indigo-50 border-2 border-indigo-100 hover:bg-indigo-100 rounded-2xl text-2xl font-bold text-indigo-700 shadow-sm transition-colors";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(choice, btn) {
            // Prevent multiple clicks
            const allBtns = document.querySelectorAll('#options-grid button');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            const questionArea = document.getElementById('question-area');
            const isCorrect = choice === currentQuestion.answer;

            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                // Correct Answer Logic
                score += 10;
                currentStreak++;
                document.getElementById('score-display').innerText = score;
                updateStreakDisplay();

                feedback.innerText = "🌟 Bravo ! C'est juste !";
                feedback.classList.add('bg-green-100', 'text-green-700');
                btn.classList.add('correct-btn');
                
                // Show completed word
                document.getElementById('word-display').innerHTML = currentQuestion.word.replace('_', `<span class="text-green-500">${currentQuestion.answer}</span>`);

                if (currentStreak > 0 && currentStreak % 3 === 0) {
                    triggerConfetti();
                    feedback.innerText = "🔥 Incroyable ! Série de 3 !";
                }

                setTimeout(renderQuestion, 1500);
            } else {
                // Wrong Answer Logic
                currentStreak = 0;
                updateStreakDisplay();
                questionArea.classList.add('shake-animation');

                feedback.innerHTML = `Oups ! La bonne réponse était <span class="text-red-600">${currentQuestion.answer}</span>`;
                feedback.classList.add('bg-red-100', 'text-red-700');
                btn.classList.add('wrong-btn');
                
                // Show corrected word
                document.getElementById('word-display').innerHTML = currentQuestion.word.replace('_', `<span class="text-red-500 line-through">${choice}</span> <span class="text-green-500">${currentQuestion.answer}</span>`);
                
                // Add to mistakes if not already there
                const isAlreadyMistake = mistakes.some(m => m.word === currentQuestion.word);
                if(!isAlreadyMistake) {
                    mistakes.push(currentQuestion);
                    localStorage.setItem('ce2-mistakes', JSON.stringify(mistakes));
                }
                
                setTimeout(renderQuestion, 2500); // Give a bit more time to read the correction
            }
        }

        // Start the game on load
        window.onload = renderQuestion;
    </script>
</body>
</html>
