<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Maths CM1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
        
        /* Utility class to hide elements */
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-sky-100 font-sans text-slate-800 selection:bg-indigo-200">

    <div id="menu-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl p-8 max-w-lg w-full text-center border-4 border-sky-300">
            <h1 class="text-4xl md:text-5xl font-black text-indigo-600 mb-2 tracking-tight">Super Maths CM1!</h1>
            <p class="text-lg text-slate-500 mb-8 font-medium">Choisis ton défi d'aujourd'hui</p>
            
            <div class="flex flex-col gap-4">
                <button onclick="startGame('tables')" class="group relative overflow-hidden bg-emerald-400 hover:bg-emerald-500 text-white text-xl font-bold py-5 px-6 rounded-2xl shadow-lg transition-transform active:scale-95">
                    <span class="relative z-10">❌ Tables de 6 à 9</span>
                    <div class="absolute top-0 -left-[100%] w-full h-full bg-white/20 skew-x-12 group-hover:left-[100%] transition-all duration-500"></div>
                </button>

                <button onclick="startGame('addsub9')" class="group relative overflow-hidden bg-rose-400 hover:bg-rose-500 text-white text-xl font-bold py-5 px-6 rounded-2xl shadow-lg transition-transform active:scale-95">
                    <span class="relative z-10">➕ Le Défi du ±9</span>
                    <div class="absolute top-0 -left-[100%] w-full h-full bg-white/20 skew-x-12 group-hover:left-[100%] transition-all duration-500"></div>
                </button>

                <button onclick="startGame('mult10')" class="group relative overflow-hidden bg-amber-400 hover:bg-amber-500 text-white text-xl font-bold py-5 px-6 rounded-2xl shadow-lg transition-transform active:scale-95">
                    <span class="relative z-10">🪄 Les Zéros Magiques (x10, x100, x1000)</span>
                    <div class="absolute top-0 -left-[100%] w-full h-full bg-white/20 skew-x-12 group-hover:left-[100%] transition-all duration-500"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="game-view" class="hidden min-h-screen flex-col items-center justify-center p-4">
        
        <!-- Header Bar -->
        <div class="w-full max-w-2xl flex justify-between items-center mb-6 bg-white/80 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-sky-200">
            <button onclick="returnToMenu()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-xl transition-colors flex items-center gap-2">
                🏠 Retour
            </button>
            <div class="flex gap-4 items-center">
                <div id="streak-display" class="bg-orange-100 text-orange-600 px-4 py-2 rounded-xl font-bold flex items-center gap-2">
                    🔥 Série: 0
                </div>
                <div id="score-display" class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-xl font-bold flex items-center gap-2 text-xl">
                    ⭐ Score: 0
                </div>
            </div>
        </div>

        <!-- Main Game Card -->
        <div id="game-card" class="bg-white rounded-3xl shadow-xl p-6 md:p-8 max-w-2xl w-full text-center border-4 border-sky-300 transition-all duration-300">
            
            <div class="flex justify-center items-center gap-3 mb-2">
                <span id="mascot" class="text-3xl animate-bounce">🤔</span>
                <h2 id="mode-title" class="text-sm font-bold text-sky-500 uppercase tracking-widest">
                    Mode Title
                </h2>
            </div>
            
            <div class="text-5xl md:text-7xl font-black text-slate-800 mt-4 mb-8 py-8 bg-slate-50 rounded-2xl shadow-inner border border-slate-100 flex flex-col items-center justify-center min-h-[200px]">
                <div id="question-text">? + ? = ?</div>
                
                <!-- Grid Container (only for tables) -->
                <div id="grid-container" class="hidden mt-6 flex-col items-center justify-center w-full">
                    <div id="emoji-grid" class="grid gap-1 md:gap-2 p-3 bg-white/60 rounded-2xl shadow-sm border-2 border-slate-200">
                        <!-- Emojis injected here -->
                    </div>
                    <div id="grid-caption" class="text-sm text-slate-400 font-medium mt-3">
                        <!-- Caption injected here -->
                    </div>
                </div>
            </div>

            <form id="answer-form" class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <input
                    id="user-input"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9\s]*"
                    placeholder="Ta réponse..."
                    autocomplete="off"
                    class="w-full md:w-64 text-center text-3xl font-bold py-4 px-6 border-4 border-slate-200 rounded-2xl focus:border-indigo-400 focus:outline-none transition-colors disabled:opacity-50 disabled:bg-slate-100"
                />
                <button 
                    id="submit-btn"
                    type="submit"
                    class="w-full md:w-auto bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-300 text-white text-2xl font-bold py-4 px-8 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"
                >
                    Valider <span class="text-3xl">🚀</span>
                </button>
            </form>

            <!-- Feedback Area -->
            <div id="feedback-area" class="mt-8 min-h-[64px] flex flex-col items-center justify-center">
                <!-- Feedback injected here -->
            </div>

        </div>
    </div>

    <script>
        // --- State Variables ---
        let currentMode = 'menu'; 
        let score = 0;
        let streak = 0;
        let currentQuestion = null;
        let feedbackState = null; // 'correct', 'incorrect', null
        let inputTimeout = null;

        const EMOJIS = ['🍎', '⭐️', '🚀', '🦖', '🎈', '🐶', '🍩', '⚽️', '💎', '🐸', '🦄', '🍓'];

        // --- DOM Elements ---
        const menuView = document.getElementById('menu-view');
        const gameView = document.getElementById('game-view');
        
        const streakDisplay = document.getElementById('streak-display');
        const scoreDisplay = document.getElementById('score-display');
        const gameCard = document.getElementById('game-card');
        const mascot = document.getElementById('mascot');
        const modeTitle = document.getElementById('mode-title');
        
        const questionText = document.getElementById('question-text');
        const gridContainer = document.getElementById('grid-container');
        const emojiGrid = document.getElementById('emoji-grid');
        const gridCaption = document.getElementById('grid-caption');
        
        const answerForm = document.getElementById('answer-form');
        const userInput = document.getElementById('user-input');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackArea = document.getElementById('feedback-area');

        // --- Helper Functions ---
        const formatNumberFR = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Clean user input to only allow numbers and spaces
        userInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9\s]/g, '');
            // Enable/disable submit based on input
            submitBtn.disabled = e.target.value.trim() === '';
        });

        const generateTableQuestion = () => {
            const table = getRandomInt(6, 9);
            const multiplier = getRandomInt(1, 10);
            const emoji = EMOJIS[getRandomInt(0, EMOJIS.length - 1)];
            return {
                text: `${table} × ${multiplier} = ?`,
                answer: table * multiplier,
                type: 'tables',
                table: table,
                multiplier: multiplier,
                emoji: emoji
            };
        };

        const generateAddSub9Question = () => {
            const isAdd = Math.random() > 0.5;
            const baseNumber = getRandomInt(11, 89);
            if (isAdd) {
                return {
                    text: `${baseNumber} + 9 = ?`,
                    answer: baseNumber + 9,
                    tip: `Astuce : Fais +10 puis -1 ! (${baseNumber} + 10 = ${baseNumber + 10}, - 1 = ${baseNumber + 9})`,
                    type: 'addsub9'
                };
            } else {
                return {
                    text: `${baseNumber} - 9 = ?`,
                    answer: baseNumber - 9,
                    tip: `Astuce : Fais -10 puis +1 ! (${baseNumber} - 10 = ${baseNumber - 10}, + 1 = ${baseNumber - 9})`,
                    type: 'addsub9'
                };
            }
        };

        const generateMult10Question = () => {
            const multipliers = [10, 100, 1000];
            const mult = multipliers[Math.floor(Math.random() * multipliers.length)];
            let baseNumber;
            
            if (mult === 10) baseNumber = getRandomInt(12, 999);
            else if (mult === 100) baseNumber = getRandomInt(12, 99);
            else baseNumber = getRandomInt(2, 99);

            return {
                text: `${formatNumberFR(baseNumber)} × ${formatNumberFR(mult)} = ?`,
                answer: baseNumber * mult,
                type: 'mult10',
                tip: `Astuce : Ajoute le nombre de zéros !`
            };
        };

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            streak = 0;
            
            // Set titles
            if (mode === 'tables') modeTitle.textContent = "Tables de 6 à 9";
            else if (mode === 'addsub9') modeTitle.textContent = "Le Défi du 9";
            else if (mode === 'mult10') modeTitle.textContent = "Les Zéros Magiques";

            // Switch views
            menuView.classList.add('hidden');
            gameView.classList.remove('hidden');
            gameView.style.display = 'flex'; // override tailwind utility hidden
            
            updateScoreUI();
            nextQuestion();
        }

        function returnToMenu() {
            currentMode = 'menu';
            clearTimeout(inputTimeout);
            gameView.classList.add('hidden');
            gameView.style.display = 'none';
            menuView.classList.remove('hidden');
        }

        function nextQuestion() {
            // Reset UI for new question
            userInput.value = '';
            submitBtn.disabled = true;
            userInput.disabled = false;
            setFeedbackUI(null);
            
            // Generate question based on mode
            if (currentMode === 'tables') currentQuestion = generateTableQuestion();
            else if (currentMode === 'addsub9') currentQuestion = generateAddSub9Question();
            else if (currentMode === 'mult10') currentQuestion = generateMult10Question();

            // Render Question Text
            questionText.textContent = currentQuestion.text;

            // Render Grid if tables mode
            if (currentMode === 'tables' && currentQuestion.table) {
                gridContainer.classList.remove('hidden');
                gridContainer.classList.add('flex');
                
                emojiGrid.style.gridTemplateColumns = `repeat(${currentQuestion.multiplier}, minmax(0, 1fr))`;
                emojiGrid.innerHTML = ''; // clear old grid
                
                const total = currentQuestion.table * currentQuestion.multiplier;
                for (let i = 0; i < total; i++) {
                    const row = Math.floor(i / currentQuestion.multiplier);
                    const col = i % currentQuestion.multiplier;
                    const delay = (row + col) * 0.03; 
                    
                    const cell = document.createElement('div');
                    cell.className = "text-lg md:text-2xl";
                    cell.style.animation = `popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) forwards`;
                    cell.style.animationDelay = `${delay}s`;
                    cell.style.opacity = '0';
                    cell.title = `Ligne ${row + 1}, Colonne ${col + 1}`;
                    cell.textContent = currentQuestion.emoji;
                    
                    emojiGrid.appendChild(cell);
                }
                gridCaption.textContent = `${currentQuestion.table} lignes de ${currentQuestion.multiplier} ${currentQuestion.emoji}`;
            } else {
                gridContainer.classList.add('hidden');
                gridContainer.classList.remove('flex');
            }

            userInput.focus();
        }

        answerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = userInput.value.trim();
            if (!val) return;

            // Remove spaces for checking
            const cleanUserAnswer = parseInt(val.replace(/\s/g, ''), 10);

            if (cleanUserAnswer === currentQuestion.answer) {
                // Correct
                setFeedbackUI('correct');
                score += 10 + (streak * 2);
                streak += 1;
                updateScoreUI();
                
                inputTimeout = setTimeout(() => {
                    nextQuestion();
                }, 1200);
            } else {
                // Incorrect
                setFeedbackUI('incorrect');
                streak = 0;
                updateScoreUI();
                
                inputTimeout = setTimeout(() => {
                    setFeedbackUI(null);
                    userInput.value = '';
                    submitBtn.disabled = true;
                    userInput.disabled = false;
                    userInput.focus();
                }, 2000);
            }
        });

        function updateScoreUI() {
            streakDisplay.innerHTML = `🔥 Série: ${streak}`;
            scoreDisplay.innerHTML = `⭐ Score: ${formatNumberFR(score)}`;
            updateMascot();
        }

        function updateMascot() {
            if (feedbackState === 'correct') mascot.textContent = '🥳';
            else if (feedbackState === 'incorrect') mascot.textContent = '🧐';
            else if (streak >= 5) mascot.textContent = '😎';
            else if (streak >= 3) mascot.textContent = '😁';
            else mascot.textContent = '🤔';
        }

        function setFeedbackUI(state) {
            feedbackState = state;
            updateMascot();
            
            // Reset classes
            gameCard.className = "bg-white rounded-3xl shadow-xl p-6 md:p-8 max-w-2xl w-full text-center border-4 transition-all duration-300";
            
            if (state === 'correct') {
                gameCard.classList.add('border-emerald-400', 'bg-emerald-50', 'scale-105');
                userInput.disabled = true;
                
                const bonus = streak > 1 ? (streak - 1) * 2 : 0;
                feedbackArea.innerHTML = `
                    <div class="text-emerald-500 text-2xl font-black animate-bounce flex items-center gap-2">
                       Super ! +${10 + bonus} points
                    </div>
                `;
            } else if (state === 'incorrect') {
                gameCard.classList.add('border-rose-400', 'bg-rose-50', 'animate-shake');
                
                let tipHtml = '';
                if (currentQuestion.tip) {
                    tipHtml = `<div class="text-sm text-slate-500 bg-slate-100 px-4 py-2 rounded-lg inline-block mt-2">${currentQuestion.tip}</div>`;
                }
                
                feedbackArea.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="text-rose-500 text-xl font-bold">
                          Oups ! Essaie encore.
                        </div>
                        ${tipHtml}
                    </div>
                `;
            } else {
                gameCard.classList.add('border-sky-300');
                
                // Idle feedback hints
                if (currentMode === 'addsub9') {
                    feedbackArea.innerHTML = `<div class="text-sm text-sky-600 font-medium">Rappel : Pour faire ±9, pense à utiliser 10 !</div>`;
                } else if (currentMode === 'mult10') {
                    feedbackArea.innerHTML = `<div class="text-sm text-sky-600 font-medium">N'oublie pas l'espace pour les milliers ! (ex: 1 000)</div>`;
                } else {
                    feedbackArea.innerHTML = '';
                }
            }
        }
    </script>
</body>
</html>
